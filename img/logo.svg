<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TrizLink logo">
  <title>TrizLink</title>
  <desc>Two interlocking link rings representing a short link</desc>
  <defs>
    <linearGradient id="tz-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#tz-grad)"/>
  <g fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(32,32)">
    <path d="M-8,-12 L-16,-12 A12,12 0 0,0 -16,12 L-8,12"/>
    <path d="M8,-12 L16,-12 A12,12 0 0,1 16,12 L8,12"/>
    <line x1="-12" y1="0" x2="12" y2="0"/>
  </g>
</svg>
