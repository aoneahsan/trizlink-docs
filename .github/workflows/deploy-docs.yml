# ──────────────────────────────────────────────────────────────────────────
# Deploy TrizLink Docs to GitHub Pages (custom domain: docs.trizlink.com)
#
# This is the GitHub Pages half of the dual-hosting setup. Firebase Hosting
# (site `trizlink-docs`) is the other half — deployed by the user with
# `yarn firebase:deploy` (see DEPLOY.md). Both serve the same `build/` output.
#
# The custom domain comes from `static/CNAME` (docs.trizlink.com), which
# Docusaurus copies into `build/` at build time.
#
# Enable once in the repo: Settings → Pages → Source = "GitHub Actions".
# ──────────────────────────────────────────────────────────────────────────

name: Deploy Docs (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (Docusaurus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack (Yarn)
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build
        run: yarn build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
